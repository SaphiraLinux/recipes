; Saphira-owned Asterisk directory map. Replaces the upstream
; compiled-in defaults (which resolve runtime state through /var/run)
; so that pid/socket state resolves through /run, per Saphira FHS
; policy (/run volatile, /var/run a separate persistent directory).
; The [directories] stanza must be active (no (!) template suffix) for
; the daemon to honour it. All other behaviour keeps compiled defaults.
[directories]
astcachedir => /var/cache/asterisk
astetcdir => /etc/asterisk
astmoddir => /usr/lib/asterisk/modules
astvarlibdir => /var/lib/asterisk
astdbdir => /var/lib/asterisk
astkeydir => /var/lib/asterisk
astdatadir => /var/lib/asterisk
astagidir => /var/lib/asterisk/agi-bin
astspooldir => /var/spool/asterisk
astrundir => /run/asterisk
astlogdir => /var/log/asterisk
astsbindir => /usr/sbin
