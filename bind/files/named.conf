# Saphira default named.conf: caching resolver, localhost-only.
# Recursion is deliberately NOT offered to the network by default:
# to serve LAN clients, add their nets to allow-recursion and extend
# listen-on below. Authoritative zones go in further zone blocks.
options {
	directory "/var/bind";
	pid-file "/run/named/named.pid";
	listen-on { 127.0.0.1; };
	listen-on-v6 { ::1; };
	recursion yes;
	allow-recursion { localhost; };
	dnssec-validation auto;
};
