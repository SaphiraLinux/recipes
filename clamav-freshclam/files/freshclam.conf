## Minimal freshclam seed; uncomment OfficialDatabaseIP mirrors if direct
## database.clamav.net access is restricted.
DatabaseOwner clamav
UpdateLogFile /var/log/clamav/freshclam.log
LogTime yes
# DatabaseMirror database.clamav.net is the compiled-in default.
Checks 12
NotifyClamd /etc/clamav/clamd.conf
