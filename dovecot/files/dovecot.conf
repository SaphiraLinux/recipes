# Minimal seed configuration; a mailDragon deployment replaces this with
# the full stack config (auth backend, TLS certificates, namespaces).
protocols = imap pop3 lmtp
listen = *

disable_plaintext_auth = yes

# TLS stays off until certificates are provisioned:
#   ssl = required
#   ssl_cert = </etc/ssl/dovecot/fullchain.pem
#   ssl_key = </etc/ssl/dovecot/privkey.pem
ssl = no

mail_location = maildir:~/Maildir

namespace inbox {
	inbox = yes
}

first_valid_uid = 1000

auth_mechanisms = plain login
passdb {
	driver = shadow
}
userdb {
	driver = passwd
}

plugin {
}
