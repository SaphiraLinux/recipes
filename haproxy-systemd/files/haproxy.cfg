# HAProxy example configuration (Saphira)
# Replace with site configuration; this validates out of the box:
#   haproxy -c -f /etc/haproxy/haproxy.cfg
global
	log stdout format raw local0

defaults
	mode	http
	log	global
	option	httplog
	timeout	connect 5s
	timeout	client  30s
	timeout	server  30s

frontend example
	bind *:8080
	default_backend example_nodes

backend example_nodes
	balance	roundrobin
	option	httpchk
	http-check	send	method	GET	url	/
	http-check	expect	status	200-399
