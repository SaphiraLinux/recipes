# Saphira default AP template (GB / Wi-Fi 6 / WPA3-SAE).
#
# Copy to /etc/hostapd/<iface>.conf for hostapd@<iface> instances, or
# edit in place for the plain hostapd service (which skips cleanly
# while this file is absent). Interface and channel are always
# explicit: nothing here auto-selects a radio.
#
# Credentials are NEVER shipped: set sae_password (or wpa_passphrase
# for the WPA2 alternative below) before enabling. hostapd fails
# closed without them - no silent open AP, ever.
#
# Correct AP key-management item is wpa_key_mgmt (key_mgmt is
# wpa_supplicant syntax and is rejected here).

interface=wlan0
driver=nl80211
ssid=Saphira-AP

# Regulatory: GB with 802.11d/h advertisements (DFS + TPC).
country_code=GB
ieee80211d=1
ieee80211h=1

# 5 GHz, indoor non-DFS channel 36 (legal GB indoor, no CAC wait).
hw_mode=a
channel=36

# Wi-Fi 6 / HE (requires IEEE80211AX build knob). Wide channels need
# the matching VHT pair (vht_oper_chwidth + vht_oper_centr_freq_seg0_idx)
# or the driver rejects the setting: he_oper_* alone fails closed on
# channel 36. Omitted here: 20 MHz HE, always legal where AX beacons.
# Proven 40 MHz companion for ch36 on MT7921 (AP-ENABLED, width 40,
# center1 5190); 80 MHz rejected by this radio/firmware, left out.
ieee80211ax=1
#he_oper_chwidth=1
#he_oper_centr_freq_seg0_idx=42
#vht_oper_chwidth=1
#vht_oper_centr_freq_seg0_idx=42
#ht_capab=[HT40+][SHORT-GI-20][SHORT-GI-40][TX-STBC][RX-STBC1][MAX-AMSDU-7935]

# WPA3-Personal (SAE). sae_password is mandatory - hostapd refuses to
# start without it, so no silent open AP is possible.
wpa=2
wpa_key_mgmt=SAE
#sae_password=SET-A-REAL-PASSPHRASE-THEN-UNCOMMENT
# HE with WPA/WPA2 advertises nothing unless CCMP/GCMP is enabled:
# without these two lines hostapd disables HE capabilities entirely.
wpa_pairwise=CCMP
rsn_pairwise=CCMP
ieee80211w=1

# WPA2-PSK alternative (comment out the SAE block above to use):
#wpa_key_mgmt=WPA-PSK
#wpa_passphrase=SET-A-REAL-PASSPHRASE-THEN-UNCOMMENT

# OWE transition and ACS are compiled in; enable per deployment:
#owe_transition_ssid="Saphira-Open"
#acs_num_scans=5
#channel=0
