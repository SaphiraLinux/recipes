# Upstream kubeadm systemd drop-in (kubernetes/release krel template
# cmd/krel/templates/latest/kubeadm/10-kubeadm.conf, fetched 2026-10-21).
# Saphira adaptation: /etc/sysconfig/kubelet -> /etc/default/kubelet
# (Saphira uses /etc/default; unit paths are the packaged /usr/bin ones).
#
# LAYERING (upstream contract, verified live on saphira-test 2026-10-21):
# this file is SHIPPED BY THE kubernetes PACKAGE — the kubeadm CLI never
# touches it. kubeadm init/join only generates
# /var/lib/kubelet/kubeadm-flags.env (KUBELET_KUBEADM_ARGS) and
# /var/lib/kubelet/config.yaml at runtime. Without this drop-in the
# kubelet starts bare (no --config/--kubeconfig): it runs on defaults,
# sees no static manifests, and kubeadm init fails at wait-control-plane.
# That exact failure was observed live before this file shipped.
#
# KEEP THE $VARIABLES LITERAL: ExecStart below expands them via
# Environment/EnvironmentFile at service start. Do not let any shell
# expand them at install time (a heredoc without quoted delimiter
# silently empties them and reproduces the bare-kubelet failure).
[Service]
Environment="KUBELET_KUBECONFIG_ARGS=--bootstrap-kubeconfig=/etc/kubernetes/bootstrap-kubelet.conf --kubeconfig=/etc/kubernetes/kubelet.conf"
Environment="KUBELET_CONFIG_ARGS=--config=/var/lib/kubelet/config.yaml"
# This is a file that "kubeadm init" and "kubeadm join" generates at runtime, populating the KUBELET_KUBEADM_ARGS variable dynamically
EnvironmentFile=-/var/lib/kubelet/kubeadm-flags.env
# This is a file that the user can use for overrides of the kubelet args as a last resort. Preferably, the user should use
# the .NodeRegistration.KubeletExtraArgs object in the configuration files instead. KUBELET_EXTRA_ARGS should be sourced from this file.
EnvironmentFile=-/etc/default/kubelet
ExecStart=
ExecStart=/usr/bin/kubelet $KUBELET_KUBECONFIG_ARGS $KUBELET_CONFIG_ARGS $KUBELET_KUBEADM_ARGS $KUBELET_EXTRA_ARGS
