# Saphira libvirt daemon configuration.
#
# Socket access without polkit: the libvirt group owns the client
# sockets below, so service accounts (nova) and operators join the
# group instead of running as root. rw 0770 covers guest lifecycle;
# ro 0770 covers monitoring and inspection (deliberately NOT the
# upstream 0777 default: world-readable guest metadata has no place
# on a server distro). admin stays 0700 root-only: daemon management
# opens on proven need, not by default. With polkit disabled there is
# no other gate: socket ownership and modes ARE the access policy,
# so review this file with the same care as a firewall ruleset.
unix_sock_group = "libvirt"
unix_sock_ro_perms = "0770"
unix_sock_rw_perms = "0770"
unix_sock_admin_perms = "0700"
