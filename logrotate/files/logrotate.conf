# see "man logrotate" for details

# Saphira master config. Packages and this package's own snippets
# drop rotation rules into /etc/logrotate.d. Files no logger writes
# are not rotated here: /var/log/journal belongs to journald
# retention, and syslog-style files (messages, secure, maillog)
# appear only if a syslog package deliberately creates them.

# rotate log files weekly by default
weekly

# keep 4 weeks worth of backlogs
rotate 4

# create new (empty) log files after rotating old ones
create

# use date as a suffix of the rotated file
dateext

# compress rotated text logs
compress

# packages drop log rotation information into this directory
include /etc/logrotate.d
