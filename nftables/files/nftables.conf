#!/usr/sbin/nft -f

#
# Saphira Linux default nftables configuration
#
# This is a starting point for a new Saphira installation: safe and
# useful out of the box (all policies accept, nothing blocks traffic),
# with every capability present and documented so an administrator can
# tighten or extend without redesign.
#
# How to administer this file:
#   * Edit the defines below to match your interfaces and networks.
#   * Everything in /etc/nftables.d/*.nft is included automatically -
#     put site-specific rules and DNAT rules there instead of editing
#     this file.
#   * Apply with: nft -f /etc/nftables.conf
#   * Validate before applying: nft -c -f /etc/nftables.conf
#
# Capabilities included (inert until configured):
#   * IPv4 and IPv6 treated equally, RFC-compliant ICMP/ICMPv6
#   * stateful filtering via connection tracking
#   * routing/forwarding with MSS clamping to path MTU (PPPoE-safe)
#   * NAT / DNAT / SNAT / masquerade, IPv4 and IPv6, with hairpin
#   * dynamic block/allow sets that auto-expire
#   * rate and behavioural classification hooks
#   * passive OS fingerprinting via the classification layer
#     (/usr/share/nftables/saphira/ - includes packet marks usable by
#     later policy, an NFQUEUE extension point, and OSF verdict maps)
#   * IPVS director deployments (NAT and DSR) - see the forward chain
#   * mesh (BATMAN-adv) and OLSR interfaces can simply be added to the
#     INSIDE_IF set; policy routing integrates via marks and zones
#
# Nothing here sends traffic to userspace, other machines, or the
# internet. There is no telemetry.
#

flush ruleset

# Site-specific rules: drop-in directory, applied automatically.
include "/etc/nftables.d/*.nft"

#
# Interfaces and networks - EDIT THESE to match the site.
#
# WAN_IF is "eth0"; PPPoE installations change it to "ppp0".
# INSIDE_IF lists routed internal interfaces. Interface names that do
# not exist simply never match, so listing planned interfaces (mesh0
# for BATMAN-adv, olsr0 for OLSR) is harmless.
#

define WAN_IF       = "eth0"
define INSIDE_IF    = { "lan0", "switch0", "mesh0", "olsr0" }

define LAN_IF       = "lan0"
define LAN_NET4     = 192.168.0.0/24

table inet filter {

    #
    # Dynamic block/allow lists. Empty by default; entries auto-expire.
    # IPv4 and IPv6 work identically.
    #
    #   nft add element inet filter block4 { 203.0.113.50 }
    #   nft add element inet filter block6 { 2001:db8::bad }
    #

    set block4 {
        type ipv4_addr
        flags timeout
        timeout 24h
        counter
        comment "Temporary IPv4 block list (entries expire)"
    }

    set block6 {
        type ipv6_addr
        flags timeout
        timeout 24h
        counter
        comment "Temporary IPv6 block list (entries expire)"
    }

    set allow4 {
        type ipv4_addr
        flags interval
        comment "IPv4 allow list"
    }

    set allow6 {
        type ipv6_addr
        flags interval
        comment "IPv6 allow list"
    }

    #
    # Ingress border: first-touch decisions before connection tracking.
    # Use for early drops of known-bad sources; keep it cheap.
    #

    chain border_prerouting {
        type filter hook prerouting priority -300; policy accept;

        # Example (edit before use):
        # iifname $WAN_IF ip6 saddr { 2001:db8:bad::/48 } counter drop
    }

    #
    # Input: traffic to the router itself. Policy accept by default -
    # tighten to drop when the installation is ready.
    #

    chain input {
        type filter hook input priority filter; policy accept;

        iifname "lo" counter accept
        ct state invalid counter drop
        ct state established,related counter accept

        # Dynamic lists: blocks first, allows override afterwards.
        ip saddr @block4 counter drop
        ip6 saddr @block6 counter drop
        ip saddr @allow4 counter accept
        ip6 saddr @allow6 counter accept

        # ICMP and ICMPv6: the RFC baseline a routed network needs.
        ip protocol icmp counter accept
        icmpv6 type {
            destination-unreachable,
            packet-too-big,
            time-exceeded,
            parameter-problem,
            echo-request,
            echo-reply,
            nd-router-solicit,
            nd-router-advert,
            nd-neighbor-solicit,
            nd-neighbor-advert,
            mld-listener-query,
            mld-listener-report,
            mld-listener-reduction,
            mld2-listener-report
        } counter accept

        # IPv6 (and IPv4) traceroute.
        udp dport 33434-33534 counter accept

        # DHCPv4 serving on inside interfaces; DHCPv6 client on WAN.
        iifname $INSIDE_IF udp dport 67 counter accept
        iifname $WAN_IF ip6 saddr fe80::/10 udp sport 547 udp dport 546 counter accept

        # Rate-limited public service template (uncomment and edit):
        # iifname $WAN_IF tcp dport 2222 ct state new \
        #     limit rate 30/minute burst 20 packets counter accept
        # iifname $WAN_IF tcp dport 2222 ct state new counter drop

        # Deeper classification (passive OS fingerprinting, marks,
        # behaviour) lives in the classification layer:
        #   /usr/share/nftables/saphira/saphira-classification.nft
        # Enforcement example once it is loaded:
        #   meta mark 0x10 counter accept
    }

    #
    # Forward: routed traffic between interfaces.
    #

    chain forward {
        type filter hook forward priority filter; policy accept;

        # MSS clamping to path MTU on every new connection: required
        # for PPPoE and tunneled paths, harmless elsewhere, applies to
        # IPv4 and IPv6.
        meta l4proto tcp tcp flags syn tcp option maxseg size set rt mtu

        ct state invalid counter drop
        ct state established,related counter accept

        # Dynamic lists
        ip saddr @block4 counter drop
        ip6 saddr @block6 counter drop
        ip saddr @allow4 counter accept
        ip6 saddr @allow6 counter accept

        # ICMP and ICMPv6 across the network (IPv4 and IPv6 equally).
        ip protocol icmp counter accept
        icmpv6 type {
            destination-unreachable,
            packet-too-big,
            time-exceeded,
            parameter-problem,
            echo-request,
            echo-reply,
            nd-router-solicit,
            nd-router-advert,
            nd-neighbor-solicit,
            nd-neighbor-advert,
            mld-listener-query,
            mld-listener-report,
            mld-listener-reduction,
            mld2-listener-report
        } counter accept

        # Traceroute across the router (IPv4 and IPv6).
        udp dport 33434-33534 counter accept

        # Routed internal traffic.
        iifname $INSIDE_IF oifname $INSIDE_IF counter accept
        iifname $INSIDE_IF oifname $WAN_IF counter accept

        # Zone template - duplicate per zone as needed (proven pattern):
        # iifname $WAN_IF oifname $LAN_IF ip daddr 192.168.0.10 \
        #     tcp dport { 80, 443 } counter accept
        # iifname $WAN_IF oifname $INSIDE_IF tcp dport { 22, 3306 } \
        #     reject with icmpx type admin-prohibited

        # Policy routing: rules can key off marks set by operators or
        # the classification layer, e.g.
        #   meta mark 0x20 counter accept

        # IPVS notes (configure virtual services with ipvsadm):
        #   - NAT mode: director traffic traverses this chain like any
        #     routed flow; permit the VIP/real-server networks here.
        #   - DSR mode: real servers own the VIP on loopback and the
        #     director forwards at L2 (no NAT); set arp_ignore/
        #     arp_announce on the real servers.
    }

    chain output {
        type filter hook output priority filter; policy accept;
    }
}

#
# NAT, IPv4. No rules are active by default: adding the first DNAT
# makes the hairpin rule do the right thing immediately.
#

table ip nat {

    chain prerouting {
        type nat hook prerouting priority dstnat;

        # DNAT templates (uncomment and edit):
        # iifname $WAN_IF tcp dport { 25, 993 } dnat to 192.168.0.10
        # iifname $LAN_IF ip daddr 203.0.113.10 tcp dport 993 \
        #     dnat to 192.168.0.10 comment "hairpin by public IP"
        # iifname $WAN_IF udp dport 53 dnat ip to 192.168.0.53:53
    }

    chain postrouting {
        type nat hook postrouting priority srcnat;

        # Masquerade the LAN out of the WAN (the typical router setup):
        # oifname $WAN_IF ip saddr $LAN_NET4 masquerade

        # Hairpin support: replies to DNAT-ed flows leaving through an
        # inside interface are masqueraded so they traverse this router
        # again. Inert until a DNAT rule exists.
        iifname $INSIDE_IF ct status dnat masquerade
    }

    chain output {
        type nat hook output priority -100;
    }
}

#
# NAT, IPv6 - same structure, so NAT66 and NAT64/DNS64 deployments
# (Jool) have a home alongside the IPv4 side.
#

table ip6 nat {

    chain prerouting {
        type nat hook prerouting priority dstnat;

        # iifname $WAN_IF ip6 daddr 2001:db8::10 tcp dport 443 \
        #     dnat to 2001:db8:1::10
    }

    chain postrouting {
        type nat hook postrouting priority srcnat;

        # oifname $WAN_IF ip6 saddr fd00::/8 masquerade
    }

    chain output {
        type nat hook output priority -100;
    }
}
