# Saphira runtime-path alignment for the upstream slapd.service unit.
#
# The unit file itself ships from upstream and is left byte-identical;
# this drop-in only ensures the runtime directory exists with the
# service identity before the daemon writes pidfile/argsfile there
# (mirrors the slapd.initd checkpath; see the fhs.d fragment).
[Service]
ExecStartPre=/usr/bin/install -d -m 0755 -o ldap -g ldap /var/run/slapd
