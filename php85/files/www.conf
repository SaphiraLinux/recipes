[www]

user = php-fpm
group = php-fpm
listen = /run/php-fpm85/www.sock
listen.owner = nginx
listen.group = nginx
listen.mode = 0660

pm = dynamic
pm.max_children = 10
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 3
php_admin_value[error_log] = /var/log/php85/www-error.log
php_admin_flag[log_errors] = on
