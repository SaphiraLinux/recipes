# Saphira ProFTPD default configuration, adapted from upstream
# sample-configurations/basic.conf.  Saphira differences vs the upstream
# sample:
#   - the daemon privilege-drop account is nobody:nobody (Saphira has no
#     "nogroup" group);
#   - anonymous FTP serves /srv/ftp as ftp:ftp (service account shipped
#     by saphira-baselayout);
#   - the anonymous document root is an operator choice and need NOT be
#     the ftp account home: point <Anonymous> at any directory, e.g.
#     <Anonymous /var/www/<site>/htdocs>, while the ftp home stays
#     /srv/ftp.

ServerName			"Saphira ProFTPD Server"
ServerType			standalone
DefaultServer			on

# Port 21 is the standard FTP port.
Port				21

# No IPv6 support by default.
UseIPv6				off

# Umask 022 prevents group/world-writable new files and dirs.
Umask				022

# Cap concurrent child processes (DoS guard; standalone mode).
MaxInstances			30

# Server privilege-drop account (Saphira: nobody:nobody).
User				nobody
Group				nobody

# To jail every FTP user in their home directory, uncomment:
#DefaultRoot ~

# Normally, files should be overwriteable.
AllowOverwrite			on

# Bar use of SITE CHMOD by default
<Limit SITE_CHMOD>
  DenyAll
</Limit>

# Basic anonymous-only FTP (read-only).  Remove this section to disable
# anonymous logins entirely; authenticated user logins remain supported.
<Anonymous /srv/ftp>
  User				ftp
  Group				ftp

  # Clients may log in as "anonymous" or "ftp".
  UserAlias			anonymous ftp

  MaxClients			10

  DisplayLogin			welcome.msg
  DisplayChdir			.message

  # Read-only anonymous chroot: deny WRITE everywhere inside it.
  <Limit WRITE>
    DenyAll
  </Limit>
</Anonymous>
