# Loopback seed installed by apply-accounts.sh into /etc/network.d/.
# Bringing lo up is not optional: local resolution and several
# boot-time services assume it. Interface-specific configuration
# belongs in additional files, never in edits to this one.
TYPE=physical
INTERFACE=lo
IPV4_MODE=static
IPV4_CIDR=127.0.0.1/8
IPV4_GATEWAY=
IPV4_METRIC=
IPV6_MODE=off
IPV6_CIDR=
IPV6_GATEWAY=
IPV6_METRIC=
DNS_SERVERS=
