# Legacy single-interface fallback.  It is used only when /etc/network.d/
# contains no *.conf files.  New configurations belong in that directory.
TYPE=physical
INTERFACE=eth0

IPV4_MODE=static
IPV4_CIDR=172.16.2.77/24
IPV4_GATEWAY=172.16.2.1
IPV4_METRIC=

IPV6_MODE=off
IPV6_CIDR=
IPV6_GATEWAY=
IPV6_METRIC=

DNS_SERVERS=
