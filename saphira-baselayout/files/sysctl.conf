# Saphira base sysctl defaults. Applied at boot by the sysctl
# service (OpenRC: before net/nftables; systemd: systemd-sysctl),
# or by hand: sysctl -p /etc/sysctl.conf / sysctl --system.
#
# IPv4 source routing (RFC 7126 4.3/4.4, RFC 1812 5.2.4.1): the
# kernel default is already 0; set here as a configured default so
# the intended posture is explicit and auditable. An administrator
# or later sysctl configuration can change it; this is a default,
# not an immutable lock. LSRR/SSRR packets die at the host.
# Forward-path option filtering cannot be expressed in sysctl;
# it lives in /etc/nftables.d/rfc7126-options.nft.
net.ipv4.conf.all.accept_source_route = 0
net.ipv4.conf.default.accept_source_route = 0
#
# Router Alert (RFC 7126 4.8): no knob needed. The kernel diverts it
# only to registered listeners (e.g. RSVP) and otherwise ignores it.
