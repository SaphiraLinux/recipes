# Saphira manager environment (systemd).
#
# This systemd build omits /sbin and /bin from its compiled
# DefaultEnvironment, so daemons spawning bare-name helpers (tc, ip,
# modprobe, chown, uname, readlink and friends) fail lookups on an
# otherwise correct system.
# Set the canonical PATH centrally (Saphira PATH policy) instead of
# copying per-unit workarounds into every package.
#
# Both directives are load-bearing and NOT redundant:
# - DefaultEnvironment= propagates to every service (this is what
#   daemons actually execute with; proven on Minimer 2026-10-20 where
#   ManagerEnvironment alone left mariadb/rabbitmq without /bin).
# - ManagerEnvironment= covers the manager process itself.
# A unit needing a narrower PATH sets its own Environment=, which
# still wins over both.
[Manager]
ManagerEnvironment=PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
DefaultEnvironment=PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
