# saphira-bridge - join point-to-point interfaces into one Layer 2 segment.
#
# Linux keeps ownership of ARP, NDP, IP and routing. This moves Ethernet frames
# between ports, learns which port each source address is on, and gets out of
# the way. Every host on the segment behaves exactly as it would behind a
# kernel bridge.
#
# The account the daemon drops to once its packet sockets are open. 128 is this
# package's reservation, immediately after saphira-udpdist's 127. The drop needs
# no privilege afterwards, and a reload that would require a new socket is
# refused rather than attempted, so the daemon never needs the privilege back.
uid=128
gid=128

# The topology must be a TREE. There is no spanning tree here. If a source
# address is seen on two ports, that is what a loop looks like; saphira-bridge
# reports it and counts it, and deliberately does not repair it, because quietly
# healing a miswired lab hides the mistake that caused it.

# Two or more ports are required. One port cannot join anything to anything.
port=sw0
port=sw1
port=sw2

# How long a learned address may sit unseen before it is dropped. 300s is the
# Linux bridge default. This is not decoration: the table is filled from
# addresses in incoming frames, and a lab recreates its interfaces constantly,
# so without ageing the table fills with dead entries within a few runs.
age_secs=300

# The ceiling. A bounded table is what keeps a segment from being turned into a
# memory exhaustion target by frames with arbitrary source addresses. When the
# table is full, expired entries go first; only then is the least recently seen
# address given up, and that is counted as evicted.
max_entries=4096
