# gopher-publisher.conf — Saphira Gopher publisher configuration
# Installed as /etc/saphira/gopher-publisher.conf (also available as gopher/etc/saphira/gopher-publisher.conf next to bin)
# All options also available as CLI flags; CLI overrides conf.

[gopher]
# Site to index (sitemap + Accept: text/markdown)
root_url = https://saphira.vm2.uk/

# Output Gopher tree (geomyidae base, e.g. /srv/gopher or ./out)
output_dir = /srv/gopher

# Gopher host/port for selectors in index.gph (gophermap leaves host/port empty)
gopher_host = saphira.vm2.uk
gopher_port = 70

# Bounded request timeout (seconds)
timeout = 10

# Optional root homepage include (classic gophermap lines, site-owned)
# Intro banner + curated navigation prepended only to / (deduplicated)
root_include = /srv/gopher-source/root-menu.include

# Ownership of generated files (publisher chowns if run as root)
user = gopher
group = gopher
