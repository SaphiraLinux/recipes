# Saphira Linux (c) 2026 - MIT Licensed
# saphira-gredist example service configuration
# One service is named by its file: /etc/saphira/gredist/<name>.conf
# Started as: gredist <name>   (e.g. gredist example)

# Single frontend - the address that receives Protocol 47/GRE
frontend=217.155.241.55

# One or more backends - GRE packets are rebuilt and sent to selected backend
backend=172.16.10.10
backend=172.16.10.11
backend=172.16.10.12

# IPv6 example (same format):
# frontend=2a02:8012:bc57::47
# backend=2a02:8012:bc57:100::10
# backend=2a02:8012:bc57:100::11

# Mixed pools are supported:
# frontend=217.155.241.55
# backend=172.16.10.10
# backend=2a02:8012:bc57:100::10
# frontend=2a02:8012:bc57::47
# backend=172.16.10.10
# backend=2a02:8012:bc57:100::10

# Any line starting with # or ; is a comment.
# No YAML, no TSV, no positional format.
