# saphira-earlyfw baseline: firmware dirs included on every run
# regardless of detected hardware. One per line: 'include <dir>'.
#
# Default covers Intel integrated graphics (the common physical case;
# 28MB): generic images built on non-Intel hosts still boot Intel
# targets with working GuC/DMC. PCI detection adds anything else the
# machine actually has. Empty this file for strictly minimal images
# (install-to-disk on known hardware needs no baseline).
include i915
