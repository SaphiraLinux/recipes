# Saphira initramfs contents.
#
# INTENTIONS ONLY, in the same spirit as an install profile: this file says
# what an initramfs must CONTAIN, and the generator resolves everything else.
# In particular it never lists a library. A binary's shared-library closure is
# derived from the ELF itself, so this file cannot drift away from what the
# binaries actually need.
#
# Directives:
#
#   bin  /abs/path        an executable, plus its whole library closure
#   file /abs/path [mode] a plain file
#   hook /abs/path        a RUNTIME hook: copied in, and if it is a script
#                         its shebang interpreter and that interpreter's
#                         library closure come with it
#   mod  <name>           a kernel module, plus its dependency and softdep
#                         closure
#   dir  /abs/path        a whole directory tree
#
# The kernel is chosen with --kernel, never inferred, and the modules named
# here are resolved against that kernel's modules.dep.

# /init itself is always staged by the generator and is not listed here: the
# configuration cannot describe the file that reads it.

# switch_root performs the transition. util-linux is present for exactly this,
# and /init deliberately does not reimplement it. Its library closure is pulled
# in automatically.
# /sbin, not /usr/bin: Saphira is non-usrmerged, and util-linux installs
# switch_root under /sbin. /init also falls back to /usr/bin/switch_root for
# a usrmerged tree, but the declared path has to be the one that exists.
bin /sbin/switch_root

# A shell for hooks that need one. Note this is NOT a base requirement: a hook
# written as a native executable needs nothing, and a script hook brings its
# own interpreter. It is here because /bin/sh is the one interpreter every
# system has, and hooks that are scripts are the common case.
file /bin/sh
