# Installer initramfs configuration (mode=ram): the USB installer
# environment. /init runs the entrypoint below and never leaves: the
# entrypoint mounts the payload partition by label and hands over to
# its init, which starts the installer menu on tty1.
#
# Composition contract: the media build names THIS file to
# saphira-mkinitramfs --config. No storage modules are listed: the
# installer root is ext4 on USB/SATA/virtio, all builtin. Real
# hardware needing more adds `mod` lines in a later revision, proven
# against that hardware, never speculatively.
mode=ram
installer=/lib/saphira/installer-entrypoint
bin /sbin/switch_root
bin /sbin/blkid
file /bin/sh
file /lib/saphira/installer-entrypoint
