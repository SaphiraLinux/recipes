# Example cluster: two-node dual-stack (mirrors the proven reference).
# Copy to /etc/saphira-kubernetes/clusters/ and edit every value.
CLUSTER_NAME=demo
MODE=dual
K8S_VERSION=1.37.1
POD_SUBNET_V4=10.115.0.0/16
POD_SUBNET_V6=2a02:8012:bc57:30::/60
SERVICE_SUBNET_V4=10.96.0.0/12
SERVICE_SUBNET_V6=2a02:8012:bc57:40::/112
KUBE_PROXY_MODE=nftables
SINGLE_NODE_WORKLOADS=no
# Optional management tooling (never workloads): helm crictl k9s headlamp.
# Unset (or commented) converges nothing extra. Values are bare words,
# never quoted.
#FEATURES=helm crictl k9s headlamp
