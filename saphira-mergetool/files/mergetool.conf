# mergetool.conf — saphira-mergetool configuration
# Installed as /etc/saphira/mergetool.conf. All options also available as
# CLI flags; CLI overrides conf.

[mergetool]
# Directories scanned for FILE.apk-new files (apk protected-path upgrade
# artifacts). Space separated; --scan-path overrides entirely.
scan_paths = /etc /srv/gopher-source

[policy]
# Optional: non-interactive resolution applied by --auto (fnmatch globs
# against the installed file path or the basename). Values: accept, keep.
# Unmatched files stay pending (or are prompted for on a terminal).
# /etc/init.d/* = accept
# /etc/conf.d/* = keep
