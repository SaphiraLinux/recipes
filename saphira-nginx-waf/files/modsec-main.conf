# Saphira nginx WAF chain: engine config, CRS setup, rule includes.
#
# Inert until referenced: nothing here activates on install. To
# enforce, the admin adds the load_module line (top-level context)
# and the server lines from waf-snippet.conf.example, then reloads.
# Blocking is ON by design (SecRuleEngine On in modsecurity.conf);
# flip it back to DetectionOnly there to log-only first.
#
# Order follows the CRS 4.x wiring contract: engine config, CRS
# setup, plugin configs, rules, plugins. Tune paranoia/thresholds
# in crs-setup.conf (shipped at anomaly-scoring paranoia 1).

Include /etc/nginx/modsec/modsecurity.conf
Include /etc/nginx/modsec/crs-setup.conf
Include /usr/share/owasp-crs/plugins/*-config.conf
Include /usr/share/owasp-crs/rules/*.conf
Include /usr/share/owasp-crs/plugins/*.conf
