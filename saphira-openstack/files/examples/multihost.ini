# Example inventory: multi-host cloud (two controllers, one compute).
# ILLUSTRATION ONLY. Every address below is documentation-only
# (RFC 5737 IPv4, RFC 3849 IPv6). No example value is ever a default.

[global]
domain = cloud.example
init = systemd

[node ctrl-1]
roles = controller
address4 = 198.51.100.11
address6 = 2001:db8:2::11

[node ctrl-2]
roles = controller
address4 = 198.51.100.12
address6 = 2001:db8:2::12

[node compute-1]
roles = compute
address4 = 198.51.100.21
address6 = 2001:db8:2::21

[network management]
purposes = management,storage
existing = no
family = dual
cidr4 = 198.51.100.0/24
gateway4 = 198.51.100.1
mode4 = static
dns = 198.51.100.2
cidr6 = 2001:db8:2::/64
gateway6 = 2001:db8:2::1
mode6 = static

[network tenant]
purposes = tenant
existing = no
family = ipv6
cidr6 = 2001:db8:3::/64
mode6 = none

[network provider]
purposes = provider
existing = no
family = ipv4
cidr4 = 203.0.113.0/24

[storage zfs-pool]
type = zfs-pool
shared = no
existing = no
devices = /dev/sdb

[storage nfs-share]
type = nfs
shared = yes
existing = no

[service keystone]
node = ctrl-1

[service glance]
node = ctrl-1

[service nova]
node = compute-1

[service neutron-server]
node = ctrl-1

[service placement]
node = ctrl-1

[service horizon]
node = ctrl-1

[service mariadb-server]
node = ctrl-1

[service rabbitmq]
node = ctrl-1

[service memcached]
node = ctrl-1

[operations]
init = systemd
tls = selfsigned
credentials = interactive
db_node = ctrl-1
mq_node = ctrl-1
ha = none
