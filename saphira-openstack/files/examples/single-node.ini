# Example inventory: single-node cloud.
# ILLUSTRATION ONLY. Every address below is documentation-only
# (RFC 5737 IPv4, RFC 3849 IPv6). No example value is ever a default:
# the operator chooses everything.

[global]
domain = cloud.example
init = openrc

[node controller]
roles = controller,compute
address4 = 192.0.2.11
address6 = 2001:db8:1::11

[network management]
purposes = management
existing = no
family = dual
cidr4 = 192.0.2.0/24
gateway4 = 192.0.2.1
mode4 = static
dns = 192.0.2.2
cidr6 = 2001:db8:1::/64
gateway6 = 2001:db8:1::1
mode6 = static

[network provider]
purposes = provider
existing = no
family = ipv4
cidr4 = 203.0.113.0/24

[storage zfs-pool]
type = zfs-pool
shared = no
existing = no
devices = /dev/sdb

[service keystone]
node = controller

[service glance]
node = controller

[service nova]
node = controller

[service neutron-server]
node = controller

[service placement]
node = controller

[service horizon]
node = controller

[operations]
init = openrc
tls = none
credentials = interactive
db_node = controller
mq_node = controller
ha = none
