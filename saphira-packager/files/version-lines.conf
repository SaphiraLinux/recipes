# saphira version-lines policy: packages that deliberately maintain
# parallel live pkgver lines. At a genesis boundary (seed-repo) every
# declared line keeps its highest published revision instead of
# collapsing to latest-per-name. One package per line:
#
#   name base-version [base-version ...]
#
# Lines with no package in the source repository are warned about and
# skipped; names not listed here stay latest-per-name.

# Kernel lines are deliberately parallel: consumers pin the ABI line
# they were built against (e.g. saphira-kernel-headers=7.1.5).
saphira-kernel         7.1.5 7.2.2
saphira-kernel-headers 7.1.5 7.2.2
