# Saphira Linux default resource limits (saphira-pambase).
# Enforced by pam_limits.so, which every Saphira session stack calls.
# Numeric prefix keeps this below a hypothetical admin 99-local.conf,
# so local overrides always win.
#
# Fork-bomb cap: any login session is capped at 8192 processes.
# This ceiling is SHARED per uid across the whole system: namespaces
# and sessions do not isolate accounting, so every task the
# saphira-build service runs as smalley counts toward the operator's
# own interactive shells on the same uid. 2048 starved them under
# parallel builder load (proven 2026-10-26: operator fork failures
# with the daemon grinding). 8192 keeps a real bomb guard while
# clearing legitimate peaks on many-vCPU build hosts. Adjust for
# the host in 99-local.conf (it sorts after this file and wins).
*               hard    nproc           8192
#
# File descriptors: classic 1024 soft / 4096 hard pair. Services
# under systemd keep their own LimitNOFILE; this covers login
# sessions (ssh, console, su) only.

*               soft    nofile          1024
*               hard    nofile          4096
