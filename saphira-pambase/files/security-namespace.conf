# Saphira Linux polyinstantiation table (saphira-pambase).
# No rules active: every login gets the plain shared namespaces,
# matching the effective behavior of the all-commented Arch default.
#
# This file MUST exist even though it is empty of rules:
# pam_namespace fails closed (PAM_SERVICE_ERR) when it cannot open
# its config, and systemd's own systemd-user/run0 services call it
# as `required` - every logind user session would fail without this.
#
# To enable private /tmp or /home instances later, add documented
# rules here (see namespace.conf(5)); one owner only, this package.

# polydir        instance_prefix  method   list
