# saphira-pbx MCP transport (packaged default): loopback-only plain
# HTTP for local management. `saphira-pbx mcp serve` refuses a
# non-loopback listen without TLS, so exposing this beyond localhost
# requires setting hostname/certificate/private_key below (see
# saphira-pbx(8) and docs/mcp.md in the project repo). Validate any
# change with `saphira-pbx mcp serve --dry-run` and
# `saphira-pbx mcp tls-check` before reloading the service.
listen = 127.0.0.1
port = 8443
