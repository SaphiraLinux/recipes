application=/usr/bin/geomyidae
listen=172.16.0.2:70
proxy=127.0.0.1:70

# Which upstreams may assert a client identity, comma-separated IPs.
#
# This is NOT optional. A PROXY header is an assertion: whoever writes it is
# claiming to be somebody else. proxyto only accepts it from a peer listed
# here, and it refuses to start at all when this line is missing or empty -
# an empty list means "nobody is permitted to assert an identity", not
# "everybody is".
#
# Below assumes HAProxy runs on this same host, which is why the listen
# address is a specific LAN interface rather than a wildcard. Change it to
# the real address of whatever fronts this listener.
trusted_proxy=127.0.0.1
