# saphira-router instance configuration.
#
# Consumed as an environment file by both inits. The daemon is
# unprivileged; these are paths and instance selection, nothing privileged.

# Where the operator logs in and the TUI/CLI connect. Owner-private socket;
# the group below is how an authorised operator reaches it WITHOUT being able
# to write the database directly (D1 3.2, D4 1).
saphira_router_group="wheel"

# Core state. The database lives here and is writable only by the
# saphira-router identity that runs the daemon.
saphira_router_state="/var/lib/saphira-router"

# Local control surface.
saphira_router_socket="/run/saphira-router/api.sock"

# Module directory. Installing a module here makes its functionality appear
# in the TUI; removing it makes that disappear (D2 8). Runtime discovery, by
# absolute path, never a compiled-in list.
saphira_router_modules="/usr/lib/saphira-router/modules"
