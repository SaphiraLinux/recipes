# saphira-udpdist - QUIC / HTTP-3 frontend.
#
# ============================================================================
# PREREQUISITE: checksum offload MUST be off on this interface.
#
#   ethtool -K eth0 tx off rx off
#
# udpdist forwards received bytes unchanged. If hardware offload is on, the
# transport checksum it hands the distributor has not been computed yet, that
# incomplete checksum reaches the backend, and the backend discards the datagram
# at its own verification. Every packet is lost while udpdist reports a
# successful forward, so nothing in the counters would explain it.
#
# udpdist checks this at startup and refuses to run rather than serve a black
# hole. It will not change NIC state itself: silently altering network
# infrastructure behind an operator's back is not acceptable. If the platform
# is known good, skip_csum_offload_check=1 accepts that as a recorded decision.
# ============================================================================
#
# QUIC separates connection identity from the network 4-tuple on purpose, so
# hashing the tuple alone moves a connection to a different backend the moment
# the client changes address or port. udpdist therefore reads the QUIC
# Destination Connection ID where it can.
#
# quic_mode=fallback
#     Needs nothing from the backends. Ordinary HTTP/3 traverses correctly.
#     Affinity is held by a bounded 4-tuple table while the client is still
#     using client-generated Connection IDs. A source-port rebinding may
#     survive. Genuine address or path migration is NOT guaranteed, and
#     udpdist does not claim it.
#
# quic_mode=quic_lb
#     Every backend must emit routable Connection IDs per the QUIC-LB
#     configuration below. Affinity then comes from the Connection ID rather
#     than the tuple, so migration stays on the same backend. This is the mode
#     that earns the migration-safe claim, and configuration validation fails
#     rather than degrade if the CID configuration is missing or invalid.
#
# Within a single connection the two coexist by design:
#     client-generated CID -> bounded 4-tuple affinity -> routable CID
#     -> CID routing, after which the fallback state simply expires.
#
# Every backend must also present a certificate valid for this frontend's
# hostname, issued by a CA the client trusts. They are indistinguishable to the
# client, and a connection that migrates between them will check the second
# one's certificate.

frontend=198.51.100.10:443 iface=eth0 proto=quic quic_mode=quic_lb

# QUIC-LB CID scheme. The first three bits of every Connection ID name one of
# these configurations. The codepoint 0b111 is reserved: it always means
# "unroutable, use the 4-tuple fallback", and is never accepted here.
#
#   quic_config=<0..6> cid_len=<bytes> server_id_len=<bytes>
#   quic_config=<0..6> self_describing=1 server_id_len=<bytes>
#
# Pick exactly one form per configuration. A short-header packet carries no
# length field, so the length must come from here; udpdist never guesses it.
quic_config=2 cid_len=8 server_id_len=2

# Server IDs are assigned per backend and must be unique across the pool.
backend=198.51.100.21:443 mac=02:00:00:00:00:21 sid=1
backend=198.51.100.22:443 mac=02:00:00:00:00:22 sid=2
backend=198.51.100.23:443 mac=02:00:00:00:00:23 sid=3

max_datagram=1500
