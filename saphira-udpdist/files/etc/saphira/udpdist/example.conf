# saphira-udpdist - generic L4 UDP distributor, DSR style.
#
# ============================================================================
# PREREQUISITE: checksum offload MUST be off on this interface.
#
#   ethtool -K eth0 tx off rx off
#
# udpdist forwards received bytes unchanged. If hardware offload is on, the
# transport checksum it hands the distributor has not been computed yet, that
# incomplete checksum reaches the backend, and the backend discards the datagram
# at its own verification. Every packet is lost while udpdist reports a
# successful forward, so nothing in the counters would explain it.
#
# udpdist checks this at startup and refuses to run rather than serve a black
# hole. It will not change NIC state itself: silently altering network
# infrastructure behind an operator's back is not acceptable. If the platform
# is known good, skip_csum_offload_check=1 accepts that as a recorded decision.
# ============================================================================
#
# This service accepts UDP on one frontend address and port and redirects each
# flow, at layer 2, to a backend that holds the same address on its loopback
# interface. No address is ever rewritten, so the backend sees the real client
# and replies directly to it.

# The VIP. It must also be configured on the load balancer and, as /32 on
# loopback, on every backend. iface= is optional: if omitted, the interface
# owning this address is discovered automatically.
frontend=198.51.100.10:9000 iface=eth0 proto=udp

# Backends. The hardware address is required: DSR redirects at layer 2, so the
# address cannot be discovered at forwarding time. udpdist cross-checks each one
# against the neighbour table at startup and refuses to start on a mismatch.
backend=198.51.100.21:9000 mac=02:00:00:00:00:21
backend=198.51.100.22:9000 mac=02:00:00:00:00:22
backend=198.51.100.23:9000 mac=02:00:00:00:00:23

# Largest datagram accepted. Anything larger is dropped and counted; a datagram
# is never truncated, because a truncated datagram is corruption.
max_datagram=9000

# Refuse to start unless every backend carries an explicit mac.
require_mac=1
