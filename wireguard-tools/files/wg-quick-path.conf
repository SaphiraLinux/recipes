[Service]
# wg-quick is a shell script: its own ExecStart is an absolute path, so the
# unit looks correct while resolving everything the script actually runs
# through PATH. linux.bash calls `ip link add ... type wireguard`, `nft -f`
# for the fwmark/policy-routing rules, and readlink/stat/sort, so a PATH
# without those directories makes wg-quick exit 127 after a start that
# otherwise looks fine.
#
# This system is deliberately non-usrmerge: ip is /sbin/ip while wg-quick
# and wg are /usr/bin/*. Upstream's unit sets no PATH, so the service
# inherits systemd's compiled-in default, which is not guaranteed to
# contain /sbin. Stating it here makes the lookup explicit instead of
# dependent on how systemd was built.
#
# Shipped as a drop-in rather than an edit of wg-quick@.service so the unit
# itself stays byte-identical to the verified archive.
Environment=PATH=/usr/sbin:/usr/bin:/sbin:/bin